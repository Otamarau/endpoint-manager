<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/icon/endpoint-displacement-svgrepo-com.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles/styles.css">
    <title>Endpoint-Manager</title>
    <script src="scripts/script.js" defer></script>
</head>
    <body>
        
        <nav>
            <h1>Endpoint-Manager</h1>
            <input id="endpoint-search" type="search" placeholder="Search..." aria-label="Search endpoints" />
        </nav>
        <div id="content-wrapper">
            <div id="endpoint-wrapper">
                <p id="inventory-status" role="status" hidden></p>
                <table class="endpoint-table">
                    <thead>
                        <tr>
                            <th scope="col" aria-sort="none"><button type="button" class="column-sort" data-sort="username">Username <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                            <th scope="col" aria-sort="none"><button type="button" class="column-sort" data-sort="deviceName">Device name <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                            <th scope="col" aria-sort="none"><button type="button" class="column-sort" data-sort="ip">IP <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                            <th scope="col" aria-sort="none"><button type="button" class="column-sort" data-sort="rustdeskId">RustDesk ID <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                            <th scope="col" aria-sort="none"><button type="button" class="column-sort" data-sort="extension">Extension <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                        </tr>
                    </thead>
                    <tbody id="endpoint-table-body">
                        <tr class="empty-row">
                            <td colspan="5">Loading endpoints...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </body>
</html>
